<span>{{busyMsg()}}</span>
<div class="container-fluid">
  <h3 class="pt-3">Users</h3>
  @if (errorMsg(); as message) {
    <div class="alert alert-danger" role="alert">{{message}}</div>
  }
  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col">Username</th>
        <th scope="col" class="text-end">Actions</th>
      </tr>
    </thead>
    @if (users$ | async; as users) { <!-- https://angular.dev/guide/http/making-requests#best-practices -->
      <tbody> 
        @for (user of users; track user.id) {
        <tr>
          <td>
            {{user.name}}
            @if (!user.isActive) {
              <span class="badge text-bg-secondary ms-2">Inactive</span>
            }
          </td>
          <td class="text-end">
            <button type="button" routerLink="edit/{{user.publicId}}" class="btn btn-primary">Edit</button>
            &nbsp;
            @if (user.isActive) {
              <button type="button" (click)="deactivateUser(user.publicId!)" class="btn btn-danger">Deactivate</button>
            } @else {
              <button type="button" (click)="reactivateUser(user.publicId!)" class="btn btn-success">Reactivate</button>
            }
          </td>
        </tr>
        }
      </tbody>
    }
  </table>
  <div class="row offset-md-11 col-md-1">
    <button type="button" class="btn btn-primary" routerLink="add">Add</button>
  </div>
</div>
