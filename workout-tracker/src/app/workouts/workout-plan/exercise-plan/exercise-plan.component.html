<div>

    <div class="row exercise-name">
      <div class="col-12">
        <h5 class="exercise-header-row">{{field().exerciseName().value()}}</h5>
        <h6 class="exercise-header-row">Resistance Type: {{ field().resistanceType().value() | resistanceType }}</h6>
      </div>
    </div>

    <div class="row">

      <div class="col-12 col-md-4 full-height">
        <wt-exercise-plan-last-time [field]="field()"></wt-exercise-plan-last-time>
      </div>

      @if (field().recommendationReason().value()) {
        <div class="col-12 col-md-4 full-height">
          <wt-exercise-plan-suggestions [field]="field()"></wt-exercise-plan-suggestions>
        </div>
      }

      <div class="col-12 col-md-4 full-height">
        <wt-exercise-plan-next-time
          [field]="field()"
          [workoutHasBeenExecutedBefore]="workoutHasBeenExecutedBefore()"
          (resistanceBandsModalRequested)="selectResistanceBands($event)">
        </wt-exercise-plan-next-time>
      </div>

    </div>

</div>
